<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CVE Notification Board - Medical IoT Security Operations Center</title>
    
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    
    <style>
        :root {
            /* Professional Dark Theme */
            --bg-primary: #0a0a0a;
            --bg-secondary: #1a1a1a;
            --bg-tertiary: #2a2a2a;
            --bg-quaternary: #3a3a3a;
            
            /* Text Colors */
            --text-primary: #ffffff;
            --text-secondary: #e0e0e0;
            --text-muted: #a0a0a0;
            --text-accent: #00d4ff;
            
            /* Severity Colors */
            --critical-color: #ff3366;
            --high-color: #ff6b35;
            --medium-color: #ffb347;
            --low-color: #4ecdc4;
            
            /* Status Colors */
            --success-color: #00c851;
            --warning-color: #ff8800;
            --danger-color: #ff3547;
            --info-color: #33b5e5;
            
            /* Glassmorphism */
            --glass-bg: rgba(26, 26, 26, 0.8);
            --glass-border: rgba(255, 255, 255, 0.1);
            --glass-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            
            /* Borders & Shadows */
            --border-primary: #404040;
            --shadow-md: 0 4px 12px rgba(0, 0, 0, 0.6);
            --shadow-lg: 0 8px 20px rgba(0, 0, 0, 0.7);
            
            /* Animation */
            --transition: all 0.3s ease;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, var(--bg-primary) 0%, var(--bg-secondary) 100%);
            color: var(--text-primary);
            min-height: 100vh;
            line-height: 1.6;
        }

        .container {
            width: 100%;
            padding: 20px;
            max-width: 1600px;
            margin: 0 auto;
        }

        /* Header */
        .header {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 20px 30px;
            margin-bottom: 30px;
            box-shadow: var(--shadow-lg);
        }

        .header h1 {
            font-size: 2.5rem;
            font-weight: 800;
            background: linear-gradient(135deg, var(--text-accent), var(--text-primary));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
        }

        .header .subtitle {
            color: var(--text-secondary);
            font-size: 1.1rem;
            font-weight: 400;
        }

        .header .last-updated {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-top: 10px;
        }

        /* Statistics Cards */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 24px;
            box-shadow: var(--shadow-md);
            transition: var(--transition);
            position: relative;
            overflow: hidden;
        }

        .stat-card:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-lg);
        }

        .stat-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: var(--critical-color);
        }

        .stat-card.high::before { background: var(--high-color); }
        .stat-card.medium::before { background: var(--medium-color); }
        .stat-card.low::before { background: var(--low-color); }

        .stat-value {
            font-size: 2.5rem;
            font-weight: 800;
            color: var(--text-primary);
            margin-bottom: 8px;
        }

        .stat-label {
            color: var(--text-secondary);
            font-size: 0.9rem;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .stat-icon {
            position: absolute;
            top: 20px;
            right: 20px;
            font-size: 2rem;
            opacity: 0.3;
        }

        /* CVE Table */
        .cve-section {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 30px;
            box-shadow: var(--shadow-lg);
            margin-bottom: 30px;
        }

        .section-title {
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .cve-table {
            width: 100%;
            border-collapse: collapse;
            background: transparent;
        }

        .cve-table th,
        .cve-table td {
            padding: 16px;
            text-align: left;
            border-bottom: 1px solid var(--border-primary);
        }

        .cve-table th {
            background: var(--bg-tertiary);
            color: var(--text-secondary);
            font-weight: 600;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .cve-table td {
            color: var(--text-primary);
            font-size: 0.95rem;
        }

        .cve-table tr:hover {
            background: rgba(255, 255, 255, 0.03);
        }

        /* Severity Badges */
        .severity-badge {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .severity-critical {
            background: rgba(255, 51, 102, 0.2);
            color: var(--critical-color);
            border: 1px solid var(--critical-color);
        }

        .severity-high {
            background: rgba(255, 107, 53, 0.2);
            color: var(--high-color);
            border: 1px solid var(--high-color);
        }

        .severity-medium {
            background: rgba(255, 179, 71, 0.2);
            color: var(--medium-color);
            border: 1px solid var(--medium-color);
        }

        .severity-low {
            background: rgba(78, 205, 196, 0.2);
            color: var(--low-color);
            border: 1px solid var(--low-color);
        }

        /* Action Buttons */
        .action-btn {
            padding: 8px 16px;
            border: none;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            transition: var(--transition);
            margin-right: 8px;
            text-decoration: none;
            display: inline-block;
        }

        .btn-primary {
            background: var(--info-color);
            color: white;
        }

        .btn-primary:hover {
            background: #2196f3;
            transform: translateY(-1px);
        }

        .btn-warning {
            background: var(--warning-color);
            color: white;
        }

        .btn-warning:hover {
            background: #ff9500;
            transform: translateY(-1px);
        }

        .btn-success {
            background: var(--success-color);
            color: white;
        }

        .btn-success:hover {
            background: #00b344;
            transform: translateY(-1px);
        }

        /* Update Recommendations */
        .recommendations-section {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }

        .recommendation-card {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 24px;
            box-shadow: var(--shadow-md);
            transition: var(--transition);
        }

        .recommendation-card:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-lg);
        }

        .recommendation-header {
            display: flex;
            justify-content: between;
            align-items: center;
            margin-bottom: 16px;
        }

        .recommendation-cve {
            font-weight: 700;
            color: var(--text-accent);
            font-size: 1.1rem;
        }

        .urgency-score {
            background: linear-gradient(135deg, var(--critical-color), var(--high-color));
            color: white;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 0.8rem;
            font-weight: 600;
        }

        .recommendation-details {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-top: 16px;
        }

        .detail-item {
            display: flex;
            flex-direction: column;
        }

        .detail-label {
            color: var(--text-muted);
            font-size: 0.8rem;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 4px;
        }

        .detail-value {
            color: var(--text-primary);
            font-weight: 600;
        }

        /* Loading Animation */
        .loading {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid var(--border-primary);
            border-top: 4px solid var(--text-accent);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .container {
                padding: 15px;
            }
            
            .header h1 {
                font-size: 2rem;
            }
            
            .stats-grid {
                grid-template-columns: 1fr;
            }
            
            .cve-table {
                font-size: 0.85rem;
            }
            
            .cve-table th,
            .cve-table td {
                padding: 12px 8px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <h1><i class="fas fa-shield-virus"></i> CVE Notification Board</h1>
            <div class="subtitle">Medical IoT Security Operations Center - Vulnerability Management</div>
            <div class="last-updated" id="lastUpdated">Last updated: Loading...</div>
        </div>

        <!-- Statistics -->
        <div class="stats-grid" id="statsGrid">
            <div class="loading">
                <div class="spinner"></div>
            </div>
        </div>

        <!-- CVE List -->
        <div class="cve-section">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                <h2 class="section-title" style="margin-bottom: 0;">
                    <i class="fas fa-exclamation-triangle"></i>
                    Active CVE Vulnerabilities
                </h2>
                <button class="action-btn btn-primary" onclick="dashboard.refreshCVEData()" id="refreshBtn">
                    <i class="fas fa-sync-alt"></i> Refresh from OSV
                </button>
            </div>
            <div id="cveTableContainer">
                <div class="loading">
                    <div class="spinner"></div>
                </div>
            </div>
        </div>

        <!-- ML-Based Update Recommendations -->
        <div class="cve-section">
            <h2 class="section-title">
                <i class="fas fa-robot"></i>
                AI-Powered Update Recommendations
            </h2>
            <div class="recommendations-section" id="recommendationsContainer">
                <div class="loading">
                    <div class="spinner"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        class CVEDashboard {
            constructor() {
                this.apiBaseUrl = 'http://127.0.0.1:8001/api'; // API server
                this.refreshInterval = 30000; // 30 seconds
                this.cachedCVEs = []; // Cache CVE data for offline functionality
                this.init();
            }

            async init() {
                await this.loadDashboardData();
                this.startAutoRefresh();
            }

            async loadDashboardData() {
                try {
                    const response = await fetch(`${this.apiBaseUrl}/cve/dashboard`);
                    if (!response.ok) throw new Error('Failed to fetch CVE data');
                    
                    const data = await response.json();
                    
                    console.log('Full API response:', data); // Debug log
                    
                    // Cache the CVE data
                    this.cachedCVEs = data.cves || data.data?.cves || [];
                    
                    // Handle nested data structure
                    const summary = data.summary || data.data?.summary || {};
                    const cves = data.cves || data.data?.cves || [];
                    const recommendations = data.recommendations || data.data?.recommendations || [];
                    const lastUpdated = data.last_updated || data.data?.last_updated || new Date().toISOString();
                    
                    console.log('Extracted recommendations:', recommendations); // Debug log
                    
                    this.renderStatistics(summary);
                    this.renderCVETable(cves);
                    this.renderRecommendations(recommendations);
                    this.updateLastUpdated(lastUpdated);
                    
                    this.showNotification('CVE data loaded successfully', 'success');
                } catch (error) {
                    console.error('Error loading CVE data:', error);
                    this.showError('Failed to load CVE data. Loading sample data...');
                    this.loadSampleData();
                }
            }

            loadSampleData() {
                // Load sample data when API is not available
                const sampleData = {
                    summary: {
                        total_cves: 5,
                        critical_cves: 2,
                        high_severity_cves: 1,
                        exploitable_cves: 2,
                        affected_devices: 5
                    },
                    cves: [
                        {
                            cve_id: "CVE-2024-0001",
                            published_date: "2024-09-20T08:00:00Z",
                            severity_score: 9.8,
                            severity_level: "CRITICAL",
                            description: "Critical buffer overflow in medical device firmware allowing remote code execution",
                            affected_systems: '["Linux Kernel 5.4", "Medical Device Firmware v2.1"]',
                            affected_devices: '["med-ecg-001", "med-pump-002", "med-monitor-003"]',
                            patch_available: true,
                            exploit_available: true,
                            attack_vector: "NETWORK",
                            patch_complexity: "MEDIUM",
                            business_impact: "CRITICAL"
                        },
                        {
                            cve_id: "CVE-2024-0005",
                            published_date: "2024-09-21T12:00:00Z",
                            severity_score: 9.9,
                            severity_level: "CRITICAL",
                            description: "Zero-day RCE in network communication protocol",
                            affected_systems: '["Network Protocol Stack", "Communication Module"]',
                            affected_devices: '["med-ecg-001", "med-pump-002", "med-monitor-003", "med-ventilator-004", "med-scanner-005"]',
                            patch_available: false,
                            exploit_available: true,
                            attack_vector: "NETWORK",
                            patch_complexity: "HIGH",
                            business_impact: "CRITICAL"
                        }
                    ],
                    recommendations: [],
                    last_updated: new Date().toISOString()
                };
                
                this.cachedCVEs = sampleData.cves;
                this.renderStatistics(sampleData.summary);
                this.renderCVETable(sampleData.cves);
                this.renderRecommendations(sampleData.recommendations);
                this.updateLastUpdated(sampleData.last_updated);
            }

            renderStatistics(summary) {
                const statsGrid = document.getElementById('statsGrid');
                statsGrid.innerHTML = `
                    <div class="stat-card critical">
                        <i class="fas fa-exclamation-circle stat-icon"></i>
                        <div class="stat-value">${summary.critical_cves}</div>
                        <div class="stat-label">Critical CVEs</div>
                    </div>
                    <div class="stat-card high">
                        <i class="fas fa-exclamation-triangle stat-icon"></i>
                        <div class="stat-value">${summary.high_severity_cves}</div>
                        <div class="stat-label">High Severity</div>
                    </div>
                    <div class="stat-card medium">
                        <i class="fas fa-shield-alt stat-icon"></i>
                        <div class="stat-value">${summary.total_cves}</div>
                        <div class="stat-label">Total CVEs</div>
                    </div>
                    <div class="stat-card low">
                        <i class="fas fa-bug stat-icon"></i>
                        <div class="stat-value">${summary.exploitable_cves}</div>
                        <div class="stat-label">Exploitable</div>
                    </div>
                `;
            }

            renderCVETable(cves) {
                const container = document.getElementById('cveTableContainer');
                
                // Cache CVEs for details modal
                this.cachedCves = cves;
                
                if (cves.length === 0) {
                    container.innerHTML = '<p class="text-center">No active CVEs found.</p>';
                    return;
                }

                const table = `
                    <table class="cve-table">
                        <thead>
                            <tr>
                                <th>CVE ID</th>
                                <th>Severity</th>
                                <th>Score</th>
                                <th>Description</th>
                                <th>Affected Systems</th>
                                <th>Affected Devices</th>
                                <th>Patch Status</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${cves.map(cve => this.renderCVERow(cve)).join('')}
                        </tbody>
                    </table>
                `;
                
                container.innerHTML = table;
            }

            renderCVERow(cve) {
                const affectedSystems = JSON.parse(cve.affected_systems).slice(0, 2);
                const severityClass = cve.severity_level.toLowerCase();
                
                return `
                    <tr>
                        <td>
                            <strong>${cve.cve_id}</strong>
                            <br>
                            <small style="color: var(--text-muted);">
                                ${new Date(cve.published_date).toLocaleDateString()}
                            </small>
                        </td>
                        <td>
                            <span class="severity-badge severity-${severityClass}">
                                ${cve.severity_level}
                            </span>
                        </td>
                        <td>
                            <strong style="color: ${this.getSeverityColor(cve.severity_score)}">
                                ${cve.severity_score}
                            </strong>
                        </td>
                        <td style="max-width: 300px;">
                            ${cve.description.substring(0, 100)}${cve.description.length > 100 ? '...' : ''}
                        </td>
                        <td>
                            ${affectedSystems.map(sys => `<span style="display: block; margin: 2px 0;">${sys}</span>`).join('')}
                            ${JSON.parse(cve.affected_systems).length > 2 ? `<small>+${JSON.parse(cve.affected_systems).length - 2} more</small>` : ''}
                        </td>
                        <td>
                            ${JSON.parse(cve.affected_devices || '[]').map(device => `<div style="background: rgba(59, 130, 246, 0.1); border: 1px solid rgba(59, 130, 246, 0.3); padding: 4px 8px; margin: 2px 0; border-radius: 8px; font-size: 0.85rem;"><i class="fas fa-medical"></i> ${device}</div>`).join('')}
                            ${JSON.parse(cve.affected_devices || '[]').length === 0 ? '<span style="color: var(--text-muted); font-style: italic;">No devices affected</span>' : ''}
                        </td>
                        <td>
                            ${cve.patch_available ? 
                                `<span class="severity-badge" style="background: rgba(0, 200, 81, 0.2); color: var(--success-color); border: 1px solid var(--success-color);">Available</span>` : 
                                `<span class="severity-badge" style="background: rgba(255, 53, 71, 0.2); color: var(--danger-color); border: 1px solid var(--danger-color);">Pending</span>`
                            }
                        </td>
                        <td>
                            <button class="action-btn btn-primary" onclick="dashboard.viewCVEDetails('${cve.cve_id}')">
                                <i class="fas fa-info-circle"></i> Details
                            </button>
                            ${cve.patch_available ? 
                                `<button class="action-btn btn-success" onclick="dashboard.schedulePatch('${cve.cve_id}')">
                                    <i class="fas fa-download"></i> Patch
                                </button>` : ''
                            }
                        </td>
                    </tr>
                `;
            }

            renderRecommendations(recommendations) {
                const container = document.getElementById('recommendationsContainer');
                
                console.log('Rendering recommendations:', recommendations); // Debug log
                
                if (!recommendations || recommendations.length === 0) {
                    container.innerHTML = '<p style="text-align: center; color: var(--text-muted);">No update recommendations available.</p>';
                    return;
                }

                const cards = recommendations.slice(0, 8).map(rec => `
                    <div class="recommendation-card">
                        <div class="recommendation-header">
                            <div class="recommendation-cve">${rec.cve_id}</div>
                            <div class="urgency-score">${Math.round(rec.urgency_score)}% Urgent</div>
                        </div>
                        <div style="color: var(--text-secondary); margin-bottom: 16px;">
                            Device: <strong style="color: var(--text-primary);">${rec.device_id}</strong>
                        </div>
                        <div class="recommendation-details">
                            <div class="detail-item">
                                <div class="detail-label">Recommended Time</div>
                                <div class="detail-value">
                                    ${new Date(rec.recommended_update_time).toLocaleString()}
                                </div>
                            </div>
                            <div class="detail-item">
                                <div class="detail-label">Predicted Downtime</div>
                                <div class="detail-value">${rec.predicted_downtime} minutes</div>
                            </div>
                            <div class="detail-item">
                                <div class="detail-label">Risk if Delayed</div>
                                <div class="detail-value" style="color: ${this.getRiskColor(rec.risk_if_delayed)}">
                                    ${Math.round(rec.risk_if_delayed)}%
                                </div>
                            </div>
                            <div class="detail-item">
                                <div class="detail-label">ML Confidence</div>
                                <div class="detail-value">${Math.round(rec.confidence_score)}%</div>
                            </div>
                        </div>
                        <div style="margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--border-primary);">
                            <div class="detail-label">Maintenance Window</div>
                            <div class="detail-value" style="font-size: 0.9rem;">
                                ${typeof rec.maintenance_window === 'object' ? 
                                    `${rec.maintenance_window.start} - ${rec.maintenance_window.end}` :
                                    rec.maintenance_window || 'Not specified'}
                            </div>
                        </div>
                        <div style="margin-top: 16px;">
                            <button class="action-btn btn-success" onclick="dashboard.approveUpdate('${rec.cve_id}', '${rec.device_id}')">
                                <i class="fas fa-check"></i> Approve Update
                            </button>
                            <button class="action-btn btn-warning" onclick="dashboard.rescheduleUpdate('${rec.cve_id}', '${rec.device_id}')">
                                <i class="fas fa-clock"></i> Reschedule
                            </button>
                        </div>
                    </div>
                `).join('');

                container.innerHTML = cards;
            }

            getSeverityColor(score) {
                if (score >= 9.0) return 'var(--critical-color)';
                if (score >= 7.0) return 'var(--high-color)';
                if (score >= 4.0) return 'var(--medium-color)';
                return 'var(--low-color)';
            }

            getRiskColor(risk) {
                if (risk >= 80) return 'var(--critical-color)';
                if (risk >= 60) return 'var(--high-color)';
                if (risk >= 40) return 'var(--medium-color)';
                return 'var(--low-color)';
            }

            updateLastUpdated(timestamp) {
                const element = document.getElementById('lastUpdated');
                element.textContent = `Last updated: ${new Date(timestamp).toLocaleString()}`;
            }

            showError(message) {
                console.error(message);
                this.showNotification(message, 'error');
            }

            startAutoRefresh() {
                setInterval(() => {
                    this.loadDashboardData();
                }, this.refreshInterval);
            }

            // Action handlers with proper API integration
            async viewCVEDetails(cveId) {
                this.showNotification(`Loading details for ${cveId}...`, 'info');
                try {
                    // Try to get fresh data from API, fall back to cached data
                    let cve = null;
                    
                    try {
                        const response = await fetch(`${this.apiBaseUrl}/cve/list`);
                        if (response.ok) {
                            const data = await response.json();
                            cve = data.data ? data.data.cves.find(c => c.cve_id === cveId) : data.cves?.find(c => c.cve_id === cveId);
                        }
                    } catch (apiError) {
                        console.warn('API call failed, using cached data:', apiError);
                    }
                    
                    // If API fails, try to find in current dashboard data
                    if (!cve && this.cachedCves) {
                        cve = this.cachedCves.find(c => c.cve_id === cveId);
                    }
                    
                    if (cve) {
                        this.showCVEModal(cve);
                        this.showNotification(`Details loaded for ${cveId}`, 'success');
                    } else {
                        this.showNotification(`CVE ${cveId} not found`, 'error');
                    }
                } catch (error) {
                    console.error('Error loading CVE details:', error);
                    this.showNotification(`Failed to load details for ${cveId}`, 'error');
                }
            }

            async schedulePatch(cveId) {
                this.showNotification(`Scheduling patch for ${cveId}...`, 'info');

                    // Simulate patch scheduling
                    await new Promise(resolve => setTimeout(resolve, 1000));
                    this.showNotification(`Patch scheduled for ${cveId}. Check with system administrator for deployment timeline.`, 'success');

                    console.error('Error scheduling patch:', error);
                    this.showNotification(`Failed to schedule patch for ${cveId}`, 'error');

                this.showNotification(`Approving update for ${cveId} on ${deviceId}...`, 'info');
                try {
                    const response = await fetch(`${this.apiBaseUrl}/cve/${cveId}/approve-update?device_id=${deviceId}`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'

                        body: JSON.stringify({ device_id: deviceId })
                    });
                    
                    if (response.ok) {
                        const result = await response.json();
                        this.showNotification(`Update approved for ${cveId} on ${deviceId}`, 'success');
                        // Refresh data to show updated status
                        setTimeout(() => this.loadDashboardData(), 1000);
                    } else {
                        throw new Error('Failed to approve update');
                    }
                } catch (error) {
                    console.error('Error approving update:', error);
                    this.showNotification(`Failed to approve update for ${cveId} on ${deviceId}`, 'error');
                }
            }

            async rescheduleUpdate(cveId, deviceId) {
                const newTime = prompt('Enter new update time (YYYY-MM-DD HH:MM):');
                if (!newTime) return;
                
                this.showNotification(`Rescheduling update for ${cveId} on ${deviceId}...`, 'info');
                try {
                    const response = await fetch(`${this.apiBaseUrl}/cve/${cveId}/reschedule-update`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({ 
                            device_id: deviceId,
                            new_time: newTime
                        })
                    });
                    
                    if (response.ok) {
                        const result = await response.json();
                        this.showNotification(`Update rescheduled for ${cveId} on ${deviceId} to ${newTime}`, 'success');

                    } else {
                        throw new Error('Failed to reschedule update');

                    console.error('Error rescheduling update:', error);
                    this.showNotification(`Failed to reschedule update for ${cveId} on ${deviceId}`, 'error');
                }
            }
